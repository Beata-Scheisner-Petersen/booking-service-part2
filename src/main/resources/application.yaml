spring:
  application:
    name: Booking-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Booking-service}
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASS}

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always


jwt:
  secret: ${JWT_SECRET}

server:
  port: ${PORT:8082}


management:
  endpoint:
    health:
      show-details: always
      group:
        customer-check:
          include: customerService
          show-details: always