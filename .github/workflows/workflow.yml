name: Booking-Service CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Start Docker Compose Stack
        run: docker compose up -d
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BOOKING_DB_ROOT_PASS: ${{ secrets.BOOKING_DB_ROOT_PASS }}
          BOOKING_DB_USER: ${{ secrets.BOOKING_DB_USER }}
          BOOKING_DB_PASS: ${{ secrets.BOOKING_DB_PASS }}

          CUSTOMER_DB_ROOT_PASS: ${{ secrets.CUSTOMER_DB_ROOT_PASS }}
          CUSTOMER_DB_PASS: ${{ secrets.CUSTOMER_DB_PASS }}
          CUSTOMER_DB_USER: ${{ secrets.CUSTOMER_DB_USER }}

          REVIEW_DB_ROOT_PASS: ${{ secrets.REVIEW_DB_ROOT_PASS }}
          REVIEW_DB_PASS: ${{ secrets.REVIEW_DB_PASS }}
          REVIEW_DB_USER: ${{ secrets.REVIEW_DB_USER }}

      - name: Wait for MySQL Databases to be Ready
        run: |
          echo "Waiting for databases to accept connections..."
          until nc -z localhost 3307 && nc -z localhost 3308 && nc -z localhost 3309; do
            sleep 2
          done
          echo "Databases are up and running!"

      - name: Run Integration Tests with Maven
        run: mvn test
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3307/Booking-service
          SPRING_DATASOURCE_USERNAME: ${{ secrets.BOOKING_DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.BOOKING_DB_PASS }}

      - name: Build application
        run: mvn -B package -DskipTests

      - name: Stop Containers and Cleanup
        if: always()
        run: docker compose down -v


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
              username: ${{secrets.DOCKER_HUB_USER}}
              password: ${{secrets.DOCKER_HUB_TOKEN}}

    #DOCKER IMAGE BUILD AND PUSH
      - name: Build and push Docker image for Staging
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t beatasp/booking-image:staging-${{ github.run_number }} \
            --push .

      - name: Build and push Docker image for Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            beatasp/booking-image:production-${{ github.run_number }} \
            --push .


    #DEPLOYMENT
#
#      - name: Set Staging Docker Image
#        if: github.event_name == 'pull_request'
#        run: |
#          npx -y @railway/cli@latest service source connect \
#            --image beatasp/booking-image:staging-${{ github.run_number }} \
#            --service "${{ secrets.RAILWAY_SERVICE_ID_BOOKING }}"
#        env:
#          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      # Deployment Staging

      - name: Deploy to Railway Staging
        if: github.event_name == 'pull_request'
        run: npx -y @railway/cli@latest redeploy --service "${{ secrets.RAILWAY_SERVICE_ID_BOOKING }}" --yes
        env:
            RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      # Deployment Production
      - name: Deploy to Railway Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx -y @railway/cli@latest redeploy --service "${{ secrets.RAILWAY_SERVICE_ID_BOOKING }}" --yes
        env:
                RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_BOOKING }}